name: RackWire CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rackwire-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-and-runtime:
    name: Discovery backend and pinned browser runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install discovery and test dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-test.txt
      - name: Run discovery backend tests
        run: python -m pytest -q backend/tests
      - name: Verify pinned browser runtime checksums
        run: sha256sum -c docs/runtime-checksums.sha256
