<!DOCTYPE html>
<!--
  RackWire Discovery Console — shell page.

  Purpose:  operator UI for the discovery backend (DISCOVERY-DESIGN.md §6).
            Runs a scan, reviews/confirms discovered devices, and pushes
            confirmed devices into the PRISTINE planner (served at site root,
            embedded below in an iframe) via its documented host API
            (postMessage {source:'rackwire', cmd, args} — CONTRACT-RW / planner
            "Host integration surface").
  Input:    /api/discovery/* JSON endpoints, same-origin.
  Output:   none server-side; plan payloads are handed to the planner iframe.

  The planner file (../index.html) is NEVER modified — it is driven only
  through window.RackWire / postMessage. No build step, no framework, no CDN.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070A0E">
<title>RackWire Discovery</title>
<link rel="stylesheet" href="discover.css">
</head>
<body>

<header class="topbar">
  <div class="wordmark">RACK<span>WIRE</span> <em>DISCOVERY</em></div>

  <!-- Scan control: optional CIDR; empty = backend default subnet -->
  <form id="scanForm" class="scanForm" autocomplete="off">
    <input id="subnetInput" type="text" inputmode="text" spellcheck="false"
           placeholder="subnet (blank = default)" aria-label="Subnet CIDR">
    <button id="scanBtn" type="submit" class="btn btn-accent">Scan</button>
    <button id="cancelBtn" type="button" class="btn btn-quiet" hidden>Cancel</button>
  </form>

  <div id="scanStatus" class="scanStatus" role="status" aria-live="polite"></div>

  <div class="topbar-spacer"></div>

  <button id="pushBtn" class="btn btn-accent" type="button"
          title="Build a plan payload from confirmed devices and send it to the planner">
    Push confirmed to planner
  </button>
</header>

<main class="layout">

  <!-- Left: discovered-device table -->
  <section class="devicePane" aria-label="Discovered devices">
    <div class="paneHead">
      <h2>Devices</h2>
      <select id="statusFilter" aria-label="Filter by status">
        <option value="">all</option>
        <option value="discovered">discovered</option>
        <option value="confirmed">confirmed</option>
        <option value="rejected">rejected</option>
        <option value="imported">imported</option>
      </select>
      <button id="refreshBtn" class="btn btn-quiet" type="button">Refresh</button>
    </div>
    <div class="tableScroll">
      <table id="deviceTable" class="deviceTable">
        <thead>
          <tr>
            <th>IP</th><th>MAC</th><th>Vendor</th>
            <th>Class</th><th>Conf</th><th>Status</th>
          </tr>
        </thead>
        <tbody id="deviceRows">
          <tr class="emptyRow"><td colspan="6">No devices yet — run a scan.</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <!-- Right: the pristine planner, embedded untouched. ?embed=1 hides its chrome. -->
  <section class="plannerPane" aria-label="Planner">
    <iframe id="plannerFrame" src="../index.html?embed=1"
            title="RackWire planner"></iframe>
  </section>

</main>

<!-- Detail drawer: slides over the device pane on row click -->
<aside id="drawer" class="drawer" hidden aria-label="Device detail">
  <div class="drawerHead">
    <h2 id="drawerTitle">Device</h2>
    <button id="drawerClose" class="btn btn-quiet" type="button" aria-label="Close">&times;</button>
  </div>
  <div id="drawerBody" class="drawerBody"><!-- filled by discover.js --></div>
  <div class="drawerActions">
    <label class="chk"><input id="useClaude" type="checkbox"> use Claude</label>
    <button id="inferBtn"   class="btn"          type="button">Infer</button>
    <button id="confirmBtn" class="btn btn-ok"   type="button">Confirm</button>
    <button id="rejectBtn"  class="btn btn-crit" type="button">Reject</button>
  </div>
</aside>

<!-- Toast line for transient errors / notices -->
<div id="toast" class="toast" role="alert" hidden></div>

<script type="module" src="discover.js"></script>
</body>
</html>
