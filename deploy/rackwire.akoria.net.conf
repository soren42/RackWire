# RackWire — standalone discovery + planner vhost.
#
# https://rackwire.akoria.net/
# Name-based (SNI) HTTPS vhost on the standard :443, selected by Host so it
# coexists with the SolariNet dashboard and the akoria.net landing vhost on the
# same port. Modeled on solarinet.conf.
#
# Layout under DocumentRoot /var/www/rackwire:
#   /                 -> the PRISTINE planner index.html (byte-for-byte the
#                        standalone app; preserves its same-origin http contract)
#   /discover/        -> the discovery console (web/), which iframes ../ (the
#                        planner) and drives it through the documented host API
#   /api/discovery/*  -> reverse-proxied to the Python discovery service
#                        (gunicorn on 127.0.0.1:8785). Apache never runs the
#                        backend itself; it only proxies.

<VirtualHost *:443>
    ServerName  rackwire.akoria.net
    DocumentRoot /var/www/rackwire

    SSLEngine on
    # Self-signed internal cert, mirroring the dashboard vhost. Generated by
    # deploy/gen-cert.sh. Swap for a CA-issued cert when RackWire moves to
    # dedicated, public-facing hardware.
    SSLCertificateFile    /etc/ssl/rackwire/rackwire.pem
    SSLCertificateKeyFile /etc/ssl/rackwire/rackwire.key

    Header always set X-Content-Type-Options "nosniff"
    # The planner's three-way contract includes same-origin iframe embedding;
    # SAMEORIGIN lets the /discover/ console frame the planner while blocking
    # cross-site framing.
    Header always set X-Frame-Options "SAMEORIGIN"

    # Discovery API -> gunicorn. mod_proxy_http must be enabled (a2enmod proxy
    # proxy_http). Vhost-scope ProxyPass (NOT inside a <Location>): the prefix
    # is preserved end-to-end, so /api/discovery/health reaches the backend at
    # the same path. ProxyPass here also short-circuits the filesystem handler,
    # so the path is never served from DocumentRoot. Order matters — this must
    # precede the <Directory> block. The bare "/" is left unproxied so static
    # assets (planner, console) continue to serve from disk.
    ProxyPreserveHost On
    ProxyPass        "/api/discovery" "http://127.0.0.1:8785/api/discovery"
    ProxyPassReverse "/api/discovery" "http://127.0.0.1:8785/api/discovery"

    <Directory /var/www/rackwire>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # App code (planner + console) MUST revalidate every load so a deploy is
    # instantly visible — same rationale as the dashboard vhost (Safari's
    # heuristic cache otherwise serves hours-stale html/js).
    <FilesMatch "\.(js|css|html)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>

    ErrorLog  ${APACHE_LOG_DIR}/rackwire_error.log
    CustomLog ${APACHE_LOG_DIR}/rackwire_access.log combined
</VirtualHost>
